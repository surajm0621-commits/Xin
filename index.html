<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>CodeLab - Online Coding Platform</title>
<style>
  :root{--bg:#0f1117;--panel:#171a23;--line:#262b38;--text:#e6e8ee;--muted:#8b92a5;--accent:#6c8cff;--ok:#3ddc97;--err:#ff6b6b}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  body{display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
  header h1{font-size:16px;font-weight:700;margin-right:auto}
  header h1 span{color:var(--accent)}
  button{background:var(--line);color:var(--text);border:0;border-radius:8px;padding:8px 12px;font-size:13px;cursor:pointer}
  button.primary{background:var(--accent);color:#fff;font-weight:600}
  button.active{background:var(--accent);color:#fff}
  main{flex:1;display:flex;min-height:0}
  .pane{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
  .editor-pane{border-right:1px solid var(--line)}
  .tabs{display:flex;gap:6px;padding:8px;background:var(--panel);border-bottom:1px solid var(--line)}
  textarea{flex:1;width:100%;resize:none;border:0;outline:0;background:var(--bg);color:var(--text);
    font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;line-height:1.5;padding:12px;tab-size:2;white-space:pre}
  iframe{flex:1;width:100%;border:0;background:#fff}
  #console{height:130px;overflow:auto;background:var(--panel);border-top:1px solid var(--line);
    font-family:ui-monospace,Menlo,monospace;font-size:12px;padding:8px}
  #console div{padding:2px 0;border-bottom:1px dashed var(--line);white-space:pre-wrap;word-break:break-word}
  #console .error{color:var(--err)} #console .warn{color:#ffc857}
  .bar{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;background:var(--panel);
    border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
  .mobile-switch{display:none}
  @media(max-width:700px){
    main{flex-direction:column}
    .editor-pane{border-right:0}
    .mobile-switch{display:flex;gap:6px;padding:6px 8px;background:var(--panel);border-bottom:1px solid var(--line)}
    main.show-editor .preview-pane{display:none}
    main.show-preview .editor-pane{display:none}
    header .hide-m{display:none}
  }
</style>
</head>
<body>
<header>
  <h1>&lt;/&gt; Code<span>Lab</span></h1>
  <button id="templateBtn" class="hide-m">Reset</button>
  <button id="downloadBtn">Download</button>
  <button id="runBtn" class="primary">▶ Run</button>
</header>

<div class="mobile-switch">
  <button id="mEditor" class="active">Editor</button>
  <button id="mPreview">Preview</button>
</div>

<main id="main" class="show-editor">
  <section class="pane editor-pane">
    <div class="tabs">
      <button data-tab="html" class="active">HTML</button>
      <button data-tab="css">CSS</button>
      <button data-tab="js">JavaScript</button>
    </div>
    <textarea id="editor" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off"></textarea>
    <div class="bar"><span id="status">Ready</span><span id="lang">HTML</span></div>
  </section>

  <section class="pane preview-pane">
    <iframe id="preview" sandbox="allow-scripts allow-modals allow-forms"></iframe>
    <div id="console"></div>
    <div class="bar"><span>Console</span><button id="clearBtn">Clear</button></div>
  </section>
</main>

<script>
(function(){
  var KEY = 'codelab_project_v1';
  var DEFAULT = {
    html: '<h1>Hello, CodeLab! 👋</h1>\n<p>Apna code yahan likho.</p>\n<button id="btn">Click me</button>',
    css:  'body{font-family:sans-serif;text-align:center;padding:40px;background:#f4f6ff}\nh1{color:#4a5fe0}\nbutton{padding:10px 18px;border:0;border-radius:8px;background:#4a5fe0;color:#fff;font-size:16px}',
    js:   'document.getElementById("btn").addEventListener("click", function(){\n  console.log("Button clicked!");\n  alert("Hello from CodeLab!");\n});'
  };

  var files, current = 'html';
  try { files = JSON.parse(localStorage.getItem(KEY)) || null; } catch(e){ files = null; }
  if(!files) files = JSON.parse(JSON.stringify(DEFAULT));

  var editor = document.getElementById('editor');
  var preview = document.getElementById('preview');
  var consoleEl = document.getElementById('console');
  var statusEl = document.getElementById('status');
  var langEl = document.getElementById('lang');
  var main = document.getElementById('main');
  var timer;

  function save(){
    try{ localStorage.setItem(KEY, JSON.stringify(files)); statusEl.textContent = 'Saved ✓'; }
    catch(e){ statusEl.textContent = 'Save failed'; }
  }

  function loadTab(t){
    files[current] = editor.value;
    current = t;
    editor.value = files[t];
    langEl.textContent = {html:'HTML',css:'CSS',js:'JavaScript'}[t];
    document.querySelectorAll('[data-tab]').forEach(function(b){
      b.classList.toggle('active', b.dataset.tab === t);
    });
  }

  function build(){
    var bridge =
      '<script>(function(){' +
      'function send(t,a){try{parent.postMessage({__cl:1,type:t,msg:Array.prototype.map.call(a,function(x){' +
      'try{return typeof x==="object"?JSON.stringify(x):String(x)}catch(e){return String(x)}}).join(" ")},"*")}catch(e){}}' +
      '["log","warn","error","info"].forEach(function(k){var o=console[k];console[k]=function(){send(k,arguments);o.apply(console,arguments)}});' +
      'window.addEventListener("error",function(e){send("error",[e.message+" (line "+e.lineno+")"])});' +
      '})();<\/script>';
    return '<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">' +
      '<style>' + files.css + '</style></head><body>' + files.html + bridge +
      '<script>' + files.js + '<\/script></body></html>';
  }

  function run(){
    files[current] = editor.value;
    save();
    preview.srcdoc = build();
  }

  function log(type, text){
    var d = document.createElement('div');
    d.className = type; d.textContent = '› ' + text;
    consoleEl.appendChild(d);
    consoleEl.scrollTop = consoleEl.scrollHeight;
  }

  window.addEventListener('message', function(e){
    if(e.data && e.data.__cl) log(e.data.type, e.data.msg);
  });

  editor.addEventListener('input', function(){
    statusEl.textContent = 'Typing...';
    clearTimeout(timer);
    timer = setTimeout(function(){ consoleEl.innerHTML=''; run(); }, 700);
  });

  editor.addEventListener('keydown', function(e){
    if(e.key === 'Tab'){
      e.preventDefault();
      var s = editor.selectionStart;
      editor.value = editor.value.slice(0,s) + '  ' + editor.value.slice(editor.selectionEnd);
      editor.selectionStart = editor.selectionEnd = s + 2;
    }
    if((e.ctrlKey || e.metaKey) && e.key === 'Enter'){ consoleEl.innerHTML=''; run(); }
  });

  document.querySelectorAll('[data-tab]').forEach(function(b){
    b.addEventListener('click', function(){ loadTab(b.dataset.tab); });
  });

  document.getElementById('runBtn').addEventListener('click', function(){
    consoleEl.innerHTML=''; run();
    main.className = 'show-preview';
    setMobile('preview');
  });

  document.getElementById('clearBtn').addEventListener('click', function(){ consoleEl.innerHTML=''; });

  document.getElementById('templateBtn').addEventListener('click', function(){
    if(confirm('Saara code reset kar du?')){
      files = JSON.parse(JSON.stringify(DEFAULT));
      editor.value = files[current]; consoleEl.innerHTML=''; run();
    }
  });

  document.getElementById('downloadBtn').addEventListener('click', function(){
    files[current] = editor.value;
    var blob = new Blob([build()], {type:'text/html'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'my-project.html';
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
  });

  function setMobile(v){
    main.className = v === 'preview' ? 'show-preview' : 'show-editor';
    document.getElementById('mEditor').classList.toggle('active', v === 'editor');
    document.getElementById('mPreview').classList.toggle('active', v === 'preview');
  }
  document.getElementById('mEditor').addEventListener('click', function(){ setMobile('editor'); });
  document.getElementById('mPreview').addEventListener('click', function(){ run(); setMobile('preview'); });

  editor.value = files[current];
  run();
})();
</script>
</body>
</html>
